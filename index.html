<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2948ef">
<title>Zply Order Tracker</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232948ef'/%3E%3Cstop offset='1' stop-color='%236a4cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M19 19h26v6L28 39h17v6H19v-6l17-14H19z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#2948ef;--p2:#1b34c4;--pl:#eef1ff;--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e5e9f2;--sh:0 1px 2px rgba(15,23,42,.04),0 12px 32px -12px rgba(15,23,42,.14)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#131a2e;--tx:#eef2ff;--mu:#94a3b8;--bd:#222b45;--pl:#1b2547;--sh:0 12px 32px -12px rgba(0,0,0,.6)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Anek Bangla",system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.55}
button,input{font:inherit;color:inherit}

/* splash */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(135deg,#2948ef,#6a4cff);transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
#splash h1{font-size:clamp(56px,16vw,92px);font-weight:700;color:#fff;display:flex}
#splash h1 span{display:inline-block;opacity:0;transform:translateY(24px) scale(.8);animation:in .5s cubic-bezier(.2,.9,.3,1.2) forwards}
#splash h1 span:nth-child(2){animation-delay:.08s}#splash h1 span:nth-child(3){animation-delay:.16s}#splash h1 span:nth-child(4){animation-delay:.24s}
@keyframes in{to{opacity:1;transform:none}}

/* hero */
.hero{background:linear-gradient(135deg,#2948ef 0%,#5b45f5 100%);color:#fff;padding:28px 20px 80px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:28px;font-weight:700}
.logo img{width:36px;height:36px;border-radius:10px}
.hero h1{font-size:22px;font-weight:600;margin-top:14px}
.hero p{opacity:.85;font-size:15px;margin-top:2px}
main{max-width:560px;margin:-52px auto 0;padding:0 16px 50px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh)}

/* search */
.search{padding:20px}
.search label{font-weight:600;font-size:16px;display:block;margin-bottom:10px}
.search input{width:100%;background:var(--bg);border:2px solid var(--bd);border-radius:14px;outline:0;padding:15px 16px;font-size:19px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;text-align:center;transition:.2s}
.search input:focus{border-color:var(--p);background:var(--card)}
.search input::placeholder{text-transform:none;letter-spacing:0;font-weight:400;font-size:16px;color:var(--mu)}
.btn{background:var(--p);color:#fff;border:0;border-radius:14px;padding:15px 22px;font-weight:600;font-size:17px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:hover{background:var(--p2)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6}
.search .btn{margin-top:12px}
.hint{font-size:13.5px;color:var(--mu);margin-top:12px;text-align:center}

/* result */
#result{margin-top:18px}
.res{overflow:hidden;animation:up .4s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.img{background:var(--pl);padding:14px;display:flex;justify-content:center}
.img img{max-width:100%;max-height:190px;object-fit:contain;display:block;border-radius:12px}
.body{padding:20px}
.body h2{font-size:20px;line-height:1.35}
.idrow{margin-top:6px;font-size:14px;color:var(--mu)}
.idrow b{color:var(--tx);letter-spacing:.5px}
.status{margin-top:16px;padding:14px 16px;border-radius:14px;display:flex;align-items:center;gap:12px}
.status .ic{width:36px;height:36px;border-radius:50%;background:currentColor;flex:none;display:grid;place-items:center}
.status .ic svg{width:18px;height:18px;color:#fff}
.status b{display:block;font-size:17px;line-height:1.3}
.status small{font-size:13.5px;opacity:.85}
.s-pending{color:#b45309;background:#fef3c7}.s-confirmed{color:#1d4ed8;background:#dbeafe}.s-processing{color:#6d28d9;background:#ede9fe}
.s-shipped{color:#0e7490;background:#cffafe}.s-completed{color:#15803d;background:#dcfce7}.s-cancelled{color:#be123c;background:#ffe4e6}.s-returned{color:#475569;background:#e2e8f0}
.status b,.status small{color:inherit}

/* stepper */
.steps{display:flex;margin:22px 0 4px}
.step{flex:1;text-align:center;position:relative;font-size:12px;color:var(--mu)}
.step .dot{width:26px;height:26px;margin:0 auto 6px;border-radius:50%;background:var(--bg);border:2px solid var(--bd);display:grid;place-items:center;position:relative;z-index:1}
.step .dot svg{width:13px;height:13px;opacity:0}
.step:not(:last-child):after{content:"";position:absolute;top:12px;left:50%;width:100%;height:2px;background:var(--bd)}
.step.done .dot{background:var(--p);border-color:var(--p);color:#fff}.step.done .dot svg{opacity:1}
.step.done:not(:last-child):after{background:var(--p)}
.step.now{color:var(--tx);font-weight:700}
.note{margin-top:16px;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14.5px}
.note small{display:block;color:var(--mu);font-size:12.5px}
.tl{margin-top:20px;border-top:1px dashed var(--bd);padding-top:14px}
.tl h4{font-size:14px;margin-bottom:6px}
.tl div{display:flex;gap:10px;align-items:center;font-size:14.5px;padding:5px 0}
.tl i{width:9px;height:9px;border-radius:50%;background:var(--bd);flex:none}
.tl div:first-of-type i{background:var(--p)}
.tl span{margin-left:auto;color:var(--mu);font-size:13px;text-align:right}
.linkbtn{margin-top:18px;background:var(--pl);color:var(--p);}
.linkbtn:hover{background:var(--pl);filter:brightness(.96)}
.linkbtn.ok{background:#dcfce7;color:#15803d}

/* history */
.hhead{margin:28px 4px 10px;font-weight:600;font-size:16px}
.tabs{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--mu);cursor:pointer}
.tabs button.on{background:var(--p);color:#fff}
.tabs em{font-style:normal;font-size:12px;opacity:.85;margin-left:4px}
.row{display:flex;gap:12px;align-items:center;padding:10px;margin-bottom:10px;cursor:pointer;transition:.15s}
.row:hover{transform:translateY(-2px)}
.row img{width:60px;height:60px;border-radius:12px;object-fit:contain;background:var(--pl);flex:none}
.row .t{flex:1;min-width:0}
.row h3{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mu);font-size:12.5px;display:block}
.pill{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.empty{text-align:center;padding:30px 16px;color:var(--mu);font-size:14.5px}
.empty svg{width:42px;height:42px;margin-bottom:8px;opacity:.5}
.sk{height:84px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,var(--bd) 25%,var(--bg) 50%,var(--bd) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
footer{text-align:center;color:var(--mu);font-size:12.5px;padding:10px 0 30px}
</style>
</head>
<body>
<div id="splash"><h1><span>Z</span><span>p</span><span>l</span><span>y</span></h1></div>

<div class="hero">
  <div class="logo"><img src="favicon.svg" alt="" onerror="this.remove()">Zply</div>
  <h1>আপনার অর্ডার কোথায় আছে?</h1>
  <p>অর্ডার আইডি দিলেই জানতে পারবেন</p>
</div>

<main>
  <form class="card search" id="form" autocomplete="off">
    <label for="oid">আপনার অর্ডার আইডি লিখুন</label>
    <input id="oid" placeholder="যেমন: ZP7K2M9QXA" inputmode="text" autocapitalize="characters" spellcheck="false">
    <button class="btn" id="go" type="submit">অর্ডার দেখুন</button>
    <p class="hint">অর্ডার কনফার্মেশন মেসেজে আইডিটি পাবেন।</p>
  </form>

  <div id="result"></div>

  <div class="hhead">আপনার দেখা অর্ডার</div>
  <div class="tabs">
    <button data-tab="active" class="on" type="button">চলমান<em id="cA"></em></button>
    <button data-tab="archive" type="button">আর্কাইভ<em id="cB"></em></button>
  </div>
  <div id="history"></div>
  <footer>© Zply</footer>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const app = initializeApp({
  apiKey:"AIzaSyAEceD8l87__1sklFuFhIdWcdWa38s-dSc",
  authDomain:"zply-order-track.firebaseapp.com",
  databaseURL:"https://zply-order-track-default-rtdb.firebaseio.com",
  projectId:"zply-order-track",
  storageBucket:"zply-order-track.firebasestorage.app",
  messagingSenderId:"812894133197",
  appId:"1:812894133197:web:120d1b934925403ca10284"
});
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LABEL = {pending:"অপেক্ষমাণ",confirmed:"কনফার্ম",processing:"প্রস্তুত হচ্ছে",shipped:"পাঠানো হয়েছে",completed:"সম্পন্ন",cancelled:"বাতিল",returned:"রিটার্ন"};
const MSG = {
  pending:["অর্ডার পাওয়া গেছে","শীঘ্রই কনফার্ম করা হবে।"],
  confirmed:["অর্ডার কনফার্ম হয়েছে","আপনার অর্ডারটি গ্রহণ করা হয়েছে।"],
  processing:["অর্ডার প্রস্তুত হচ্ছে","শীঘ্রই পাঠানো হবে।"],
  shipped:["অর্ডার পাঠানো হয়েছে","খুব শীঘ্রই আপনার কাছে পৌঁছাবে।"],
  completed:["অর্ডার সম্পন্ন হয়েছে","ধন্যবাদ আমাদের সাথে থাকার জন্য!"],
  cancelled:["অর্ডার বাতিল করা হয়েছে",""],
  returned:["অর্ডার রিটার্ন করা হয়েছে",""]
};
const FLOW = ["pending","confirmed","processing","shipped","completed"];
const ARCHIVE = ["completed","cancelled","returned"];
const KEY = "zply_track_ids";
const getIds = () => { try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch{ return []; } };
const setIds = a => { try{ localStorage.setItem(KEY,JSON.stringify(a)); }catch{} };
const saveId = id => setIds([...getIds().filter(x=>x!==id),id]);
const fmt = v => { const ms = v?.toMillis ? v.toMillis() : (typeof v==="number" ? v : 0); return ms ? new Date(ms).toLocaleString("bn-BD",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}) : ""; };
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
const BOX = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8zM3 8l9 5 9-5M12 13v8"/></svg>';
const LINK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>';

setTimeout(()=>$("splash").classList.add("hide"),1200);

const cache = {};
async function fetchOrder(id){
  const s = await getDoc(doc(db,"trackOrders",id));
  return s.exists() ? (cache[id] = s.data()) : null;
}

function trackUrl(id){
  const u = new URL(location.href);
  u.search = "?id=" + encodeURIComponent(id);
  u.hash = "";
  return u.toString();
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch{}
  try{
    const a = document.createElement("textarea");
    a.value = t; a.style.cssText = "position:fixed;opacity:0;top:0;left:0";
    document.body.appendChild(a); a.focus(); a.select();
    const ok = document.execCommand("copy"); a.remove(); return ok;
  }catch{ return false; }
}

function detail(o){
  const st = o.status || "pending";
  const idx = FLOW.indexOf(st);
  const msg = MSG[st] || [LABEL[st]||st,""];
  const hist = (o.history||[]).slice().reverse();
  const stepper = idx>=0 ? `<div class="steps">${FLOW.map((s,i)=>`<div class="step ${i<=idx?"done":""} ${i===idx?"now":""}"><div class="dot">${CHECK}</div>${LABEL[s]}</div>`).join("")}</div>` : "";
  return `<div class="card res">
    ${o.image?`<div class="img"><img src="${esc(o.image)}" alt="" onerror="this.parentNode.remove()"></div>`:""}
    <div class="body">
      <h2>${esc(o.title)}</h2>
      <div class="idrow">অর্ডার আইডি: <b>${esc(o.orderId)}</b></div>
      <div class="status s-${esc(st)}"><div class="ic">${CHECK}</div><div><b>${esc(msg[0])}</b>${msg[1]?`<small>${esc(msg[1])}</small>`:""}</div></div>
      ${stepper}
      ${o.note?`<div class="note"><small>নোট</small>${esc(o.note)}</div>`:""}
      ${hist.length?`<div class="tl"><h4>অর্ডার আপডেট</h4>${hist.map(h=>`<div><i></i>${LABEL[h.status]||esc(h.status)}<span>${fmt(h.at)}</span></div>`).join("")}</div>`:""}
      <button class="btn linkbtn" data-copylink="${esc(o.orderId)}" type="button">${LINK}<span>লিঙ্ক কপি করুন</span></button>
    </div></div>`;
}

function show(o){
  $("result").innerHTML = detail(o);
  $("result").scrollIntoView({behavior:"smooth",block:"start"});
}

async function search(idArg){
  const id = (idArg || $("oid").value).replace(/\s+/g,"").toUpperCase();
  if(!id){ $("oid").focus(); return; }
  $("oid").value = id;
  $("go").disabled = true;
  $("result").innerHTML = '<div class="sk" style="height:300px"></div>';
  try{
    const o = await fetchOrder(id);
    if(!o){ $("result").innerHTML = `<div class="card empty">${BOX}<br><b>কোনো অর্ডার পাওয়া যায়নি</b><br>আইডিটি আবার চেক করে চেষ্টা করুন।</div>`; }
    else{ saveId(id); $("result").innerHTML = detail(o); $("result").scrollIntoView({behavior:"smooth",block:"start"}); loadHistory(); }
  }catch(e){
    console.error(e);
    $("result").innerHTML = `<div class="card empty">${BOX}<br><b>লোড করা যায়নি</b><br>ইন্টারনেট কানেকশন চেক করুন।</div>`;
  }
  $("go").disabled = false;
}
$("form").addEventListener("submit",e=>{ e.preventDefault(); search(); });

document.addEventListener("click",async e=>{
  const c = e.target.closest("[data-copylink]");
  if(c){
    const url = trackUrl(c.dataset.copylink);
    const ok = await copyText(url);
    const span = c.querySelector("span");
    if(ok){ span.textContent = "লিঙ্ক কপি হয়েছে ✓"; c.classList.add("ok"); }
    else{ prompt("এই লিঙ্কটি কপি করুন:",url); return; }
    setTimeout(()=>{ span.textContent = "লিঙ্ক কপি করুন"; c.classList.remove("ok"); },1800);
    return;
  }
  const r = e.target.closest("[data-open]");
  if(r && cache[r.dataset.open]) show(cache[r.dataset.open]);
});

let tab = "active";
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
  tab = b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));
  loadHistory();
});

async function loadHistory(){
  const ids = getIds().reverse();
  const el = $("history");
  if(!ids.length){ $("cA").textContent=$("cB").textContent=""; el.innerHTML = `<div class="empty">${BOX}<br>এখনো কোনো অর্ডার দেখা হয়নি।<br>আইডি দিয়ে খুঁজলে এখানে জমা থাকবে।</div>`; return; }
  el.innerHTML = '<div class="sk"></div><div class="sk"></div>';
  const list = await Promise.all(ids.map(id=>cache[id] ? Promise.resolve(cache[id]) : fetchOrder(id).catch(()=>undefined)));
  const live = list.filter(Boolean);
  const A = live.filter(o=>!ARCHIVE.includes(o.status)), B = live.filter(o=>ARCHIVE.includes(o.status));
  $("cA").textContent = A.length ? `(${A.length})` : ""; $("cB").textContent = B.length ? `(${B.length})` : "";
  const items = tab==="archive" ? B : A;
  el.innerHTML = items.length ? items.map(o=>`<div class="card row" data-open="${esc(o.orderId)}">
      <img src="${esc(o.image)}" alt="" onerror="this.style.visibility='hidden'">
      <div class="t"><small>${esc(o.orderId)}</small><h3>${esc(o.title)}</h3><span class="pill s-${esc(o.status)}">${LABEL[o.status]||esc(o.status)}</span></div>
    </div>`).join("")
    : `<div class="empty">${BOX}<br>${tab==="archive" ? "আর্কাইভ খালি।<br>সম্পন্ন, বাতিল ও রিটার্ন অর্ডার এখানে থাকবে।" : "কোনো চলমান অর্ডার নেই।"}</div>`;
}

const q = new URLSearchParams(location.search).get("id");
if(q) search(q);
loadHistory();
</script>
</body>
</html>
